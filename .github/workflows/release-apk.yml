name: Build & Release APK

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Unit_Calculator.apk"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TITLE="Latest Build ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          printf '**Branch:** `%s`\n**Commit:** `%s` — %s\n' \
            "${{ github.ref_name }}" \
            "${{ steps.sha.outputs.short }}" \
            "$COMMIT_MSG" > /tmp/release-notes.md
          gh release create latest \
            "Unit_Calculator.apk" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            --latest
